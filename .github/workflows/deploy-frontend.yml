# Автоматическая публикация фронтенда на GitHub Pages.
# Запускается при каждом push в ветку main (если менялась папка frontend)
# и вручную: вкладка Actions -> Deploy frontend -> Run workflow.
name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          # Адрес backend берётся из переменной репозитория API_URL
          # (Settings -> Secrets and variables -> Actions -> Variables)
          REACT_APP_API_URL: ${{ vars.API_URL }}
          GENERATE_SOURCEMAP: 'false'
          CI: 'false'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
